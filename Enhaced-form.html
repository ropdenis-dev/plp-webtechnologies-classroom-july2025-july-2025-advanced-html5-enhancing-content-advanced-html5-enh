<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Enhanced HTML5 page with lists, tables, media, and a validated form">
  <title>Enhanced HTML5 Form</title>
</head>
<body>
  <header>
    <h1>Enhanced HTML5 Page</h1>
    <p>Example of lists, tables, media, and a validated form.</p>
  </header>
  <main>
    <!-- Lists -->
    <section>
      <h2>Favorite Programming Languages</h2>
      <ul>
        <li>Python</li>
        <li>JavaScript</li>
        <li>HTML & CSS</li>
      </ul>
    </section>
    <!-- Table -->
    <section>
      <h2>Sample Data Table</h2>
      <table border="1">
        <thead>
          <tr><th>Name</th><th>Role</th></tr>
        </thead>
        <tbody>
          <tr><td>Alice</td><td>Developer</td></tr>
          <tr><td>Bob</td><td>Designer</td></tr>
        </tbody>
      </table>
    </section>
    <!-- Media -->
    <section>
      <h2>Media Example</h2>
      <img src="https://via.placeholder.com/200" alt="Sample image">
      <audio src="https://www.w3schools.com/html/horse.mp3" controls></audio>
    </section>
    <!-- Form -->
    <section>
      <h2>Contact Form</h2>
      <form action="#" method="post" autocomplete="on">
        <fieldset>
          <legend>Personal Info</legend>
          <label for="name">Name:</label>
          <input id="name" type="text" name="name" placeholder="Enter your name" required><br><br>
          <label for="email">Email:</label>
          <input id="email" type="email" name="email" placeholder="Enter your email" required><br><br>
          <label for="password">Password:</label>
          <input id="password" type="password" name="password" placeholder="Create a password" minlength="6" required><br><br
          <label for="country">Country:</label>
          <select id="country" name="country" required>
            <option value="">Select</option>
            <option value="kenya">Kenya</option>
            <option value="uganda">Uganda</option>
          </select><br><br>
          <label>
            <input type="checkbox" name="subscribe" checked readonly>
            Subscribe to newsletter
          </label><br><br>
          <button type="submit">Submit</button>
        </fieldset>
      </form>
    </section>
  </main>
  <footer>
    <p>&copy; 2025 Enhanced HTML5 Example</p>
  </footer>
</body>
  </html>
